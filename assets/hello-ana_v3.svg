<svg width="400" height="140" viewBox="0 0 400 140"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Floating animation -->
  <g>
    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 10"
      to="0 -20"
      dur="3s"
      repeatCount="indefinite"
      direction="alternate"/>

    <text x="50" y="55"
          font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-weight="600"
          fill="#3b0764">

      <!-- LINE 1: Hello (smaller) -->
      <tspan font-size="26">

        <tspan opacity="0">H
          <animate attributeName="opacity" from="0" to="1" dur="0.15s" begin="0s" fill="freeze"/>
        </tspan>
        <tspan opacity="0">e
          <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.20s" fill="freeze"/>
        </tspan>
        <tspan opacity="0">l
          <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.40s" fill="freeze"/>
        </tspan>
        <tspan opacity="0">l
          <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.60s" fill="freeze"/>
        </tspan>
        <tspan opacity="0">o
          <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.80s" fill="freeze"/>
        </tspan>
        <tspan opacity="0">,
          <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1s" fill="freeze"/>
        </tspan>

      </tspan>

      <!-- LINE BREAK -->
      <tspan x="50" dy="36" font-size="32">

        <!-- I'm Ana -->
        <tspan opacity="0">I'm Ana
          <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.5s" fill="freeze"/>
        </tspan>

        <tspan> </tspan>

        <!-- Emojis -->
        <tspan opacity="0">👩‍💻
          <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2s" fill="freeze"/>
        </tspan>
        <tspan opacity="0">🦑
          <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.3s" fill="freeze"/>
        </tspan>

      </tspan>

    </text>
  </g>

</svg>
