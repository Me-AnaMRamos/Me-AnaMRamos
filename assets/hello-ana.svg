<svg width="400" height="120" viewBox="0 0 400 120"
     xmlns="http://www.w3.org/2000/svg">

  <rect width="400" height="120" rx="22" fill="#f9fafb"/>

  <!-- Floating animation -->
  <g>
    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="0 -8"
      dur="2s"
      repeatCount="indefinite"
      direction="alternate"/>
    
    <text x="50" y="100"
          font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="32" 
          font-weight="600"
          fill="#3b0764">
      Hello, I'm Ana 👩‍💻🦑
    </text>
  </g>

</svg>
